# Alternative to Vercel (see README). Not used by the Vercel deployment.
# Render Blueprint: one free web service that runs the API and serves the built frontend.
# The database is hosted separately on Neon (free Postgres) - paste its connection
# string into DATABASE_URL when Render asks for it.
services:
  - type: web
    name: xyz-bank
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
